name: Daily data refresh and Pages deployment

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gold-monitor-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test data checks and existing trade accounting
        run: python -m unittest discover -s tests -v
      - name: Fetch, validate, and rebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output logs
          python -u src/fetch_data.py 2>&1 | tee logs/fetch.log
          python src/validate_data.py 2>&1 | tee logs/validation.log
          python src/pipeline_weekly.py 2>&1 | tee logs/pipeline.log
          python src/monitor.py 2>&1 | tee logs/monitor.log
          test -s output/monitor.html
          cp output/monitor.html index.html
          mkdir -p _site
          cp index.html output/refresh-status.json _site/
          cp -R assets _site/assets
      - name: Record the generated page
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "Refresh market data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: refresh-diagnostics
          path: |
            logs/
            output/refresh-status.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run summary
        run: |
          echo 'Daily refresh validated. Schedule: 09:00 Asia/Singapore (01:00 UTC).' >> "$GITHUB_STEP_SUMMARY"
          cat output/refresh-status.json >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
